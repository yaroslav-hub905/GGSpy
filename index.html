<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GGSpy" />
    <title>GGSpy — Social Deduction</title>
    <meta name="description" content="Социальная дедукция в мире Dota 2. Один шпион прячется среди героев — найди его!" />
    <meta property="og:title" content="GGSpy — Dota Social Deduction" />
    <meta property="og:description" content="Один шпион прячется среди героев. Найди его до конца раунда!" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { background: #050508; margin: 0; padding: 0; min-height: 100dvh; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #050508; z-index: 9999; transition: opacity .4s;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      .spin {
        width: 36px; height: 36px;
        border: 3px solid #1a1a30; border-top-color: #e84118;
        border-radius: 50%; animation: s .75s linear infinite;
      }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash"><div class="spin"></div></div>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 400); }
        }, 300);
      });
    </script>
  </body>
</html>
